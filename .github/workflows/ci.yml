name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  import-check:
    runs-on: ubuntu-latest
    # 显式将仓库根加入 PYTHONPATH, 确保 'python -c' 与 verify.py 都能以常规包方式
    # 解析 src 命名空间 (CI 环境下 -c 的 cwd 语义偶发不稳定, 此处消除歧义)。
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile + import smoke test
        # dashboard.py 是 Streamlit 入口, 普通 python 上下文 import 会触发运行时错误,
        # 故用 py_compile 校验语法, 并用仓库根脚本 import_check.py 做真实导入
        # (脚本自身目录即仓库根, 显式插入 sys.path[0], 避免 -c 的 cwd 歧义;
        # 失败时附带 sys.path 与冲突 src 诊断)。
        run: |
          python -m py_compile dashboard.py
          python import_check.py

      - name: Run verify.py (live data, best-effort)
        # verify.py 含实时网络拉取 (Binance/yfinance), 偶发限流可能导致失败,
        # 设为 best-effort 不阻断构建, 仅作额外信号。
        continue-on-error: true
        run: python verify.py

      - name: Build Docker image (防止 Dockerfile 退化)
        # ubuntu-latest runner 自带 docker; 仅本地构建、不推送,
        # 作为硬检查确保 Dockerfile 与依赖始终可构建, 不会悄悄坏掉。
        run: docker build -t paddy-quant-workbench:ci .
